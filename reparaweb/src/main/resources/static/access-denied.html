<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Acceso restringido · ReparaWeb</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/css/style.css" />
    </head>
    <body class="auth">
        <main class="auth-card text-center">
            <div class="d-flex justify-content-end">
                <select
                    id="language-selector"
                    class="form-select form-select-sm w-auto"
                    onchange="changeLanguage(this.value)"
                    aria-label="Idioma"
                >
                    <option value="es">ES</option>
                    <option value="en">EN</option>
                </select>
            </div>
            <a class="brand" href="/">
                Repara<span>Web</span>
            </a>
            <h1 class="mt-4">Acceso restringido</h1>
            <p class="text-muted">
                Tu rol no tiene permisos para realizar esta acción.
            </p>
            <a class="btn btn-primary" href="/dashboard.html">
                Volver al panel
            </a>
        </main>
        <script src="/js/i18n.js"></script>
    </body>
</html>
