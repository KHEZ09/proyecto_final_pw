<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel · ReparaWeb</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head><body><div class="container-fluid"><div class="row app-shell"><aside class="col-lg-2 side p-4"><a class="navbar-brand fw-bold mb-4" href="/dashboard.html">Repara<span>Web</span></a><nav><a class="active" href="#nuevo">＋ Nuevo reporte</a></nav><form method="post" action="/logout" class="mt-lg-5"><button class="btn btn-outline-light w-100">Cerrar sesión</button></form></aside><main class="col-lg-10 content"><div class="d-flex justify-content-between align-items-center mb-4"><div><p class="eyebrow mb-1">Panel de trabajo</p><h1 id="greeting">Mis reportes</h1></div><span id="role" class="badge text-bg-light"></span></div><div id="stats" class="row g-3 mb-4 d-none"><div class="col-6 col-xl"><div class="stat"><small>Total</small><br><strong id="s-total">0</strong></div></div><div class="col-6 col-xl"><div class="stat"><small>Recibidos</small><br><strong id="s-recibidos">0</strong></div></div><div class="col-6 col-xl"><div class="stat"><small>En proceso</small><br><strong id="s-enProceso">0</strong></div></div><div class="col-6 col-xl"><div class="stat"><small>Resueltos</small><br><strong id="s-resueltos">0</strong></div></div><div class="col-6 col-xl"><div class="stat"><small>Urgentes</small><br><strong id="s-urgentes">0</strong></div></div></div><div class="row g-4"><div class="col-xl-4"><section id="nuevo" class="form-card"><h2>Nuevo reporte</h2><p class="text-muted">Cuéntanos qué necesita atención.</p><form id="report-form"><label>Título<input id="titulo" required maxlength="120" placeholder="Ej. Fuga de agua"></label><label>Descripción<textarea id="descripcion" required maxlength="1000" placeholder="Describe el problema..."></textarea></label><label>Categoría<select id="categoria"><option>Infraestructura</option><option>Electricidad</option><option>Hidráulica</option><option>Equipos</option><option>Aseo</option><option>Seguridad</option></select></label><label>Ubicación<input id="ubicacion" required maxlength="120" placeholder="Ej. Bloque 5, salón 204"></label><div class="row"><div class="col-6"><label>Urgencia<select id="urgencia"><option>BAJA</option><option>MEDIA</option><option>ALTA</option></select></label></div><div class="col-6"><label>Fotografía URL<input id="fotoUrl" placeholder="Opcional"></label></div></div><button class="btn btn-primary w-100 mt-4">Enviar reporte</button><div id="form-message" class="mt-3"></div></form></section></div><div class="col-xl-8"><section id="reportes" class="table-card"><div class="d-flex justify-content-between align-items-center mb-3"><div><h2 class="mb-1">Reportes</h2><p class="text-muted mb-0">Historial y estado de tus solicitudes</p></div><button class="btn btn-sm btn-outline-secondary" onclick="cargar()">Actualizar</button></div><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Código</th><th>Detalle</th><th>Urgencia</th><th>Estado</th><th>Actualizado</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="6" class="text-muted">Cargando...</td></tr></tbody></table></div></section></div></div></main></div></div><script src="/js/app.js"></script></body></html>
